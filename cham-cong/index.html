<style>
:root{
  --bg:#eef3f7;--card:#fff;--fg:#1f2340;--muted:#8a8fa3;--line:#e3e6ee;
  --blue:#2563eb;--purple:#6d4aff;--orange:#ff9800;--green:#8bc34a;--green2:#4caf50;
  --red:#e53935;--half:#2ea8ff;--np:#b98580;--nk:#c98d8d;--nl:#555a74;--none:#d5cfcf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hdr{display:flex;align-items:center;gap:8px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.hdr h1{flex:1;font-size:22px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;font-size:20px;color:var(--fg);box-shadow:0 1px 3px #0001}
.back{background:none;box-shadow:none;font-size:28px;width:32px}
.card{background:var(--card);border-radius:18px;margin:10px 0;overflow:hidden;box-shadow:0 1px 2px #0000000d}
.pad{padding:14px 18px}
.dash{border-top:1.5px dashed var(--line)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:17px}
.kv b{font-weight:600}
.muted{color:var(--muted)}
.blue{color:var(--blue)}.red{color:var(--red)}.green{color:var(--green2)}
.money-hide{letter-spacing:1px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 8px}
.act{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:var(--fg);padding:4px 0}
.act i{width:54px;height:54px;border-radius:14px;background:#fff;box-shadow:0 2px 6px #0000001a;display:grid;place-items:center;font-style:normal;font-size:24px}
.pill{display:block;margin:4px auto 14px;border:0;background:#e9ecf1;border-radius:99px;padding:8px 18px;font-size:16px;color:var(--fg)}
.seg{display:flex;background:#e3e7ec;border-radius:99px;padding:4px;margin:14px auto;max-width:420px}
.seg{overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 1 0;min-width:0;border:0;background:none;border-radius:99px;padding:10px 4px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--fg);font-weight:500;box-shadow:0 1px 3px #0002}
.sec{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.sec h3{flex:1;margin:0;font-size:17px;font-weight:600}
.search{border:0;background:#fff;border-radius:99px;padding:8px 14px;font-size:15px;width:140px}
.emp .top{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}
.av{width:44px;height:44px;border-radius:50%;background:#8e8fa8;color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.emp .nm{flex:1}.emp .nm b{display:block;font-size:17px;font-weight:500}.emp .nm span{font-size:14px;color:var(--muted)}
.emp .row2{display:flex;justify-content:space-between;padding:4px 18px;font-size:16px}
.emp .btns{display:flex;gap:10px;padding:10px 18px 16px}
.btn{border:0;border-radius:14px;padding:13px 10px;font-size:17px;color:#fff;flex:1;font-weight:500}
.btn.o{background:var(--orange)}.btn.b{background:var(--blue)}.btn.p{background:var(--purple)}.btn.g{background:var(--green2)}
.btn.done{background:#e8f5e9;color:var(--green2);border:1.5px solid var(--green2)}
.btn.gray{background:#e9ecf1;color:var(--fg)}
.btn.red{background:#fdecea;color:var(--red)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:#fff3e0;color:#e65100;margin-left:6px;vertical-align:middle}
.cal-h{display:flex;align-items:center;gap:12px;margin:18px 0 8px}
.cal-h h3{flex:1;margin:0;font-size:22px;font-weight:600}
.cal-h button{border:1.5px solid var(--fg);background:none;border-radius:8px;width:34px;height:34px;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;color:var(--fg);font-size:15px;padding:6px 0}
.day{aspect-ratio:1/1;border-radius:9px;position:relative;border:0;background:none;padding:0;color:var(--fg)}
.day .s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;padding-bottom:6px}
.day .l{position:absolute;left:5px;bottom:3px;font-size:11px}
.day .mk{position:absolute;right:4px;top:3px;font-size:10px}
.day.c1{background:var(--green);color:#fff}.day.c05{background:var(--half);color:#fff}
.day.cP{background:var(--np);color:#fff}.day.cK{background:var(--nk);color:#fff}.day.cL{background:var(--nl);color:#fff}
.day.cN{background:var(--none);color:#fff}
.day.today{outline:2.5px solid var(--purple);outline-offset:1px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:16px 0;font-size:16px}
.legend div{display:flex;align-items:center;gap:8px}
.sw{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;font-size:12px;flex:none}
.toggle{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:16px;margin:6px 0 14px}
.sw-t{width:58px;height:32px;border-radius:99px;background:#c9ced8;position:relative;border:0}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw-t.on{background:var(--blue)}.sw-t.on::after{left:29px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:9}
.bottom .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bottom .in span{flex:1;font-size:17px}
.bottom .btn{flex:none;padding:14px 22px;font-size:18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px 0}
.tabbar button i{font-style:normal;font-size:23px;filter:grayscale(1);opacity:.6}.tabbar button.on{color:var(--blue);font-weight:600}.tabbar button.on i{filter:none;opacity:1}
body.cotab{padding-bottom:calc(150px + env(safe-area-inset-bottom))!important}body.cotab .fab{bottom:calc(84px + env(safe-area-inset-bottom))}
.nvr{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit}
.nvr .t{flex:1;min-width:0}.nvr .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nvr .t small{color:var(--muted);font-size:13px}
.ip{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;background:#fff;color:var(--fg);margin-bottom:8px;-webkit-appearance:none;appearance:none}
.seg.nho button{font-size:13px;padding:9px 2px}
.bdg{display:inline-block;padding:1px 8px;border-radius:7px;font-size:12px;font-weight:600;margin-left:4px}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--orange);color:#fff;border:0;font-size:30px;box-shadow:0 4px 12px #ff980066;z-index:9}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .t{flex:1}.list .it .t small{display:block;color:var(--muted);font-size:13px}
.grp{display:flex;align-items:center;gap:12px;padding:16px 18px;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit}
.grp .t{flex:1}.grp .t b{font-size:18px;font-weight:600;display:block}.grp .t small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
/* sheet */
.ov{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#d6d9e0;margin:4px auto 10px}
.sheet h2{font-size:20px;margin:4px 0 12px}
.dmg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;margin:6px 0 4px}
.dmi{background:none;border:0;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--fg);line-height:1.2;text-align:center;border-radius:12px;min-width:0}
.dmi i{font-style:normal;font-size:26px;width:48px;height:48px;border-radius:14px;background:#f3f5f9;display:flex;align-items:center;justify-content:center}
.dmi.on i{background:#e7f0ff;box-shadow:0 0 0 2px var(--blue)}.dmi.on{color:var(--blue);font-weight:600}
.dmi.sua i{box-shadow:0 0 0 1.5px dashed #c5cad6}.dmi .tn{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.dmh{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-weight:700;color:var(--blue);font-size:16px}
.sheet label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#f7f8fb;color:var(--fg)}
.sheet .row{display:flex;gap:10px}.sheet .row>*{flex:1}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid transparent;border-radius:12px;padding:12px 8px;font-size:16px;display:flex;align-items:center;gap:8px;background:#f3f5f9;color:var(--fg)}
.opt.on{border-color:var(--purple);background:#f0ecff}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#1f2340;color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;z-index:40;max-width:90vw}
</style>
</head>

<script>
'use strict';
/* ======================= ÂM LỊCH (thuật toán Hồ Ngọc Đức, múi giờ +7) ======================= */
var AL = (function () {
  var INT = Math.floor, PI = Math.PI;
  function jd(dd, mm, yy) { var a = INT((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3; var j = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045; if (j < 2299161) j = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083; return j; }
  function newMoon(k, tz) {
    var T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = PI / 180;
    var Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3 + 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    var M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    var Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
    var F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
    var C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M) - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr) - 0.0004 * Math.sin(dr * 3 * Mpr)
      + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr)) - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M))
      - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr)) + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
    var dt = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3 : -0.000278 + 0.000265 * T + 0.000262 * T2;
    return INT(Jd1 + C1 - dt + 0.5 + tz / 24);
  }
  function sunLong(jdn, tz) {
    var T = (jdn - 2451545.5 - tz / 24) / 36525, T2 = T * T, dr = PI / 180;
    var M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2, L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
    var DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M) + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
    var L = (L0 + DL) * dr; L = L - PI * 2 * INT(L / (PI * 2)); return INT(L / PI * 6);
  }
  function m11(yy, tz) { var k = INT((jd(31, 12, yy) - 2415021) / 29.530588853), nm = newMoon(k, tz); if (sunLong(nm, tz) >= 9) nm = newMoon(k - 1, tz); return nm; }
  function leapOff(a11, tz) { var k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5), last, i = 1, arc = sunLong(newMoon(k + i, tz), tz); do { last = arc; i++; arc = sunLong(newMoon(k + i, tz), tz); } while (arc != last && i < 14); return i - 1; }
  return function (dd, mm, yy) {
    var tz = 7, dn = jd(dd, mm, yy), k = INT((dn - 2415021.076998695) / 29.530588853), ms = newMoon(k + 1, tz);
    if (ms > dn) ms = newMoon(k, tz);
    var a11 = m11(yy, tz), b11 = a11;
    if (a11 >= ms) a11 = m11(yy - 1, tz); else b11 = m11(yy + 1, tz);
    var day = dn - ms + 1, diff = INT((ms - a11) / 29), month = diff + 11;
    if (b11 - a11 > 365) { var lo = leapOff(a11, tz); if (diff >= lo) month = diff + 10; }
    if (month > 12) month -= 12;
    return { d: day, m: month };
  };
})();

/* ======================= DỮ LIỆU ======================= */
var KEY = 'chamcong_v1';
function now() { return Date.now(); }
function uid() { return now().toString(36) + Math.random().toString(36).slice(2, 7); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

/* ===== Chạy trong app App Store (Capacitor) hay trên web ===== */
var NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
var WEB_URL = 'https://raw.githack.com/lenamqb-afk/machtech-version/cham-cong/cham-cong/index.html';
var CP = {};
if (NATIVE && window.capacitorExports) ['Geolocation', 'Share', 'Filesystem', 'LocalNotifications', 'NativePurchases'].forEach(function (n) { CP[n] = capacitorExports.registerPlugin(n); });
/* Định vị: trong app dùng GPS gốc của máy, trên web dùng trình duyệt */
var GEO = !NATIVE ? navigator.geolocation : {
  getCurrentPosition: function (ok, loi, o) {
    CP.Geolocation.getCurrentPosition(o || {}).then(ok, function (e) { loi && loi({ code: /denied|permission/i.test(String(e && e.message)) ? 1 : 2, message: String(e && e.message) }); });
  },
  watchPosition: function (ok, loi, o) {
    CP.Geolocation.watchPosition(o || {}, function (p, e) { if (e || !p) { loi && loi({ code: 2 }); } else ok(p); });
  }
};
function chiaSe(txt, xong) {
  if (NATIVE && CP.Share) return CP.Share.share({ text: txt }).catch(function () {});
  if (navigator.share) return navigator.share({ text: txt }).catch(function () {});
  if (navigator.clipboard) return navigator.clipboard.writeText(txt).then(function () { toast(xong || 'Đã copy, dán vào Zalo'); }, function () { prompt('Copy nội dung này:', txt); });
  prompt('Copy nội dung này:', txt);
}
/* Lưu file: trong app ghi tạm rồi mở bảng Chia sẻ (Lưu vào Tệp, Zalo, Mail…) */
function luuFile(ten, b64, mime) {
  if (NATIVE && CP.Filesystem && CP.Share) {
    return CP.Filesystem.writeFile({ path: ten, data: b64, directory: 'CACHE' })
      .then(function (r) { return CP.Share.share({ title: ten, files: [r.uri] }); })
      .catch(function (e) { if (!/cancel/i.test(String(e && e.message))) toast('Không lưu được file'); });
  }
  var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u], { type: mime }));
  a.download = ten; document.body.appendChild(a); a.click(); a.remove();
}
function b64Chu(t) { return btoa(unescape(encodeURIComponent(t))); }
function moi() { return { v: 1, nhom: [], nv: [], cong: {}, gd: [], cc: [], tc: [], hm: [], dm: [], nt: [], cfg: { an: true, amLich: true, mayChu: '', khoa: '', dongBoLuc: 0 } }; }
var db = (function () { try { var d = JSON.parse(lsGet(KEY)); if (d && d.v) return Object.assign(moi(), d, { cfg: Object.assign(moi().cfg, d.cfg) }); } catch (e) {} return moi(); })();
var hen = null;
function luu() {
  ccMap = null;
  if (!lsSet(KEY, JSON.stringify(db))) toast('Không lưu được dữ liệu trên máy!');
  if (db.cfg.mayChu) { clearTimeout(hen); hen = setTimeout(function () { dongBo(true); }, 2500); }
  if (window.NHAC) NHAC.henLap();
}
var nhomDS = function () { return db.nhom.filter(function (x) { return !x.xoa; }); };
var nvCua = function (nhomId, caTamNgung) { return db.nv.filter(function (x) { return !x.xoa && x.nhomId === nhomId && (caTamNgung || !x.tamNgung); }); };
var timNV = function (id) { return db.nv.find(function (x) { return x.id === id; }); };
var timNhom = function (id) { return db.nhom.find(function (x) { return x.id === id; }); };

/* ======================= TIỆN ÍCH ======================= */
var LOAI_CONG = {
  '1': { ten: 'Đi làm', c: 'c1', he: 1, mau: 'var(--green)' },
  '0.5': { ten: '1/2 ngày', c: 'c05', he: 0.5, mau: 'var(--half)' },
  'P': { ten: 'Nghỉ có lý do', c: 'cP', he: 0, mau: 'var(--np)', k: '–' },
  'K': { ten: 'Nghỉ không lý do', c: 'cK', he: 0, mau: 'var(--nk)', k: '?' },
  'L': { ten: 'Nghỉ có lương', c: 'cL', he: 1, mau: 'var(--nl)', k: '–' }
};
var LOAI_GD = {
  ung: { ten: 'Ứng lương', ic: '💵', dau: -1 },
  tangca: { ten: 'Tăng ca', ic: '⏱️', dau: 1 },
  phucap: { ten: 'Phụ cấp', ic: '🎁', dau: 1 },
  tru: { ten: 'Trừ tiền', ic: '➖', dau: -1 },
  thanhtoan: { ten: 'Thanh toán', ic: '✅', dau: -1 }
};
function p2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function homNay() { return ymd(new Date()); }
function thangNay() { return homNay().slice(0, 7); }
function soNgay(th) { return new Date(+th.slice(0, 4), +th.slice(5, 7), 0).getDate(); }
function themThang(th, n) { var d = new Date(+th.slice(0, 4), +th.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); }
function tien(n) { return Math.round(n || 0).toLocaleString('en-US') + ' đ'; }

  var cheDo = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'Đã cài ra màn hình chính ✓' : '<span style="color:#e65100">Đang mở trong trình duyệt</span>';
  sheet('<div style="text-align:center"><img src="icon-192.png" alt="" style="width:76px;height:76px;border-radius:18px;box-shadow:0 4px 12px #0002"><h2 style="margin:10px 0 2px">Chấm Công Tính Lương</h2>' +
    '<div class="muted">Phiên bản ' + PHIEN_BAN + ' · ' + NGAY_PB + '</div></div>' +
    '<p style="font-size:15px;margin:14px 0">Chấm công, tính lương theo ngày công, tạm ứng, thanh toán, thu chi và tiến độ công trình. Nhân viên tự chấm bằng GPS tại công trình.</p>' +
    '<div class="sec" style="margin:4px 0"><h3>HỖ TRỢ</h3></div>' +
    '<div style="background:#f7f8fb;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px"><div style="flex:1"><div class="muted" style="font-size:14px">Hotline / Zalo</div><b style="font-size:22px;letter-spacing:.5px;user-select:all">' + HOTLINE + '</b></div>' +
    '<a class="btn g" style="flex:none;text-decoration:none;padding:10px 14px" href="tel:' + HOTLINE + '">📞 Gọi</a><a class="btn b" style="flex:none;text-decoration:none;padding:10px 14px" href="https://zalo.me/' + HOTLINE + '" target="_blank" rel="noopener">Zalo</a></div>' +
    '<div class="sec" style="margin:14px 0 4px"><h3>MÁY NÀY</h3></div><div>' +
    dong('Chế độ', la ? 'Nhân viên' : 'Quản lý') +
    dong('Cài đặt', cheDo) +
    (la ? dong('Máy chủ', lsGet('cc_nv_may') ? 'Đã kết nối' : 'Chưa có') :
      dong('Dữ liệu', dem(db.nhom) + ' công trình · ' + dem(db.nv) + ' nhân viên · ' + dem(db.gd) + ' giao dịch lương · ' + dem(db.tc) + ' thu chi · ' + dem(db.cc) + ' lần NV tự chấm') +
      dong('Dung lượng', kb + ' KB') +
      dong('Đồng bộ Google', db.cfg.mayChu ? (db.cfg.dongBoLuc ? 'Lần cuối ' + new Date(db.cfg.dongBoLuc).toLocaleString('vi-VN') : 'Đã cài, chưa đồng bộ') : '<span style="color:#e65100">Chưa cài (chỉ lưu trên máy)</span>') +
      dong('Mật khẩu mở app', KHOA.coKhoa() ? 'Đang bật ✓' : 'Chưa đặt')) +
    dong('Mạng', navigator.onLine === false ? '<span class="red">Đang mất mạng</span>' : 'Có mạng') + '</div>' +
    (la ? '' : '<p class="muted" style="font-size:13px">Dữ liệu lưu trong máy này' + (db.cfg.mayChu ? ' và trong Google Drive của anh' : '') + '. Nên vào ⚙️ › Lưu ra file để sao lưu định kỳ.</p>') +
    '<p style="text-align:center;margin:14px 0 0"><a href="' + WEB_URL.replace('index.html', 'chinh-sach.html') + '" target="_blank" rel="noopener">Chính sách quyền riêng tư</a></p>' +
    '<p class="muted" style="font-size:12px;text-align:center;margin:16px 0 0">© 2026 MachTech · Lịch âm theo thuật toán Hồ Ngọc Đức · Xuất Excel bằng SheetJS</p>' +
    '<div class="btns"><button class="btn gray" onclick="dongSheet()">Đóng</button></div>');
}


/* ======================= BẢN QUYỀN (mua 1 lần trong app) ======================= */
/* App tải miễn phí. Chế độ quản lý dùng thử NGAY_THU ngày, sau đó mua 1 lần để dùng tiếp.
   Hết hạn vẫn lưu được dữ liệu ra file. Máy nhân viên luôn miễn phí. Bản web không giới hạn. */
var BQ = (function () {
  var SP = 'vn.machtech.chamcong.quanly', K = 'cc_banquyen', K_BD = 'cc_dungthu_bd', NGAY_THU = 7, gia = '';
  var NP = function () { return CP.NativePurchases; };
  function daMua() { return !NATIVE || lsGet(K) === '1'; }
  function batDauThu() {
    if (!NATIVE) return;
    if (!lsGet(K_BD)) lsSet(K_BD, String(Date.now()));
    // Ngày tải app gốc từ App Store (giữ nguyên khi xoá app cài lại)
    if (NP() && NP().getAppTransaction) NP().getAppTransaction().then(function (r) {
      var t = Date.parse(r && r.appTransaction && r.appTransaction.originalPurchaseDate);
      if (t > Date.parse('2026-01-01') && t < +lsGet(K_BD) && t <= Date.now()) { lsSet(K_BD, String(t)); if (hetHan()) ve(); }
    }, function () {});
  }
  function conNgay() { var bd = +lsGet(K_BD) || Date.now(); return Math.max(0, NGAY_THU - Math.floor((Date.now() - bd) / 86400000)); }
  function hetHan() { return NATIVE && !daMua() && conNgay() <= 0; }
  function veHetHan() {
    $app('<div class="hdr"><h1>Chấm công</h1><button class="ic" onclick="moThongTin()">ⓘ</button></div>' +
      '<div class="card pad" style="text-align:center"><div style="font-size:46px">⏳</div><h2 style="margin:6px 0">Đã hết ' + NGAY_THU + ' ngày dùng thử</h2>' +
      '<p class="muted">Dữ liệu của anh vẫn còn nguyên trong máy. Mua bản đầy đủ 1 lần để tiếp tục chấm công, tính lương.</p>' +
      '<button class="btn p" style="width:100%;padding:16px 0;font-size:18px" onclick="BQ.moMua()">⭐ Mua bản đầy đủ</button>' +
      '<button class="btn gray" style="width:100%;margin-top:10px" onclick="saoLuu()">💾 Lưu dữ liệu ra file</button></div>' +
      '<p class="muted" style="text-align:center;font-size:13px">Máy nhân viên vẫn chấm công bình thường, miễn phí.</p>');
    $bottom('');
  }
  function bang() {
    if (!NATIVE || daMua() || hetHan()) return;
    var a = document.getElementById('app'), d = document.createElement('div');
    d.style.cssText = 'margin:0 0 10px;padding:9px 14px;border-radius:12px;background:#fff4d6;color:#7a5200;font-size:14px;font-weight:600;cursor:pointer';
    d.textContent = '⭐ Dùng thử còn ' + conNgay() + ' ngày · Bấm để mua bản đầy đủ';
    d.onclick = function () { moMua(); };
    var h = a.querySelector('.hdr'); if (h && h.nextSibling) a.insertBefore(d, h.nextSibling); else a.appendChild(d);
  }
  function coGiaoDich(ds) { return (ds || []).some(function (t) { return t.productIdentifier === SP && (t.purchaseState === undefined || String(t.purchaseState) === '1' || t.purchaseState === 'PURCHASED'); }); }
  function moKhoa() { lsSet(K, '1'); }
  function kiemTra(imLang) {
    if (!NATIVE || !NP()) return Promise.resolve(daMua());
    return NP().getPurchases({ productType: 'inapp' }).then(function (r) {
      if (coGiaoDich(r && r.purchases)) { moKhoa(); return true; } return daMua();
    }, function () { return daMua(); });
  }
  function layGia() {
    if (gia || !NATIVE || !NP()) return Promise.resolve(gia);
    return NP().getProduct({ productIdentifier: SP, productType: 'inapp' }).then(function (r) { gia = (r && r.product && r.product.priceString) || ''; return gia; }, function () { return ''; });
  }
  function moMua(lyDo) {
    var da = daMua();
    sheet('<div style="text-align:center"><div style="font-size:46px">⭐</div><h2 style="margin:6px 0">' + (da ? 'Anh đang dùng bản đầy đủ' : 'Mở khoá bản đầy đủ') + '</h2>' +
      (!da ? '<p class="muted" style="margin-top:0">' + esc(lyDo || (hetHan() ? 'Đã hết hạn dùng thử.' : 'Dùng thử còn ' + conNgay() + ' ngày.')) + '</p>' : '') + '</div>' +
      '<div class="card pad" style="margin:12px 0;box-shadow:none;border:1px solid var(--line)">' +
      ['Dùng mãi sau ' + NGAY_THU + ' ngày dùng thử, không giới hạn nhân viên, công trình', 'Tính lương, thanh toán, thu chi, tiến độ', 'Nhân viên tự chấm bằng GPS, đối chiếu', 'Xuất Excel, đồng bộ nhiều máy, nhắc chấm công', 'Trả <b>1 lần</b>, dùng mãi, không thu phí hằng tháng'].map(function (t) { return '<div style="padding:4px 0">✓ ' + t + '</div>'; }).join('') +
      '</div>' +
      (da ? '' : '<button class="btn p" id="bqMua" style="width:100%;padding:16px 0;font-size:18px">Mua bản đầy đủ <span id="bqGia"></span></button>') +
      '<button class="btn gray" id="bqKP" style="width:100%;margin-top:10px">Khôi phục giao dịch đã mua</button>' +
      '<p id="bqMsg" class="muted" style="font-size:14px;text-align:center"></p>' +
      '<p class="muted" style="font-size:12px;text-align:center">Máy nhân viên luôn miễn phí. Đã mua trên 1 iPhone thì cài máy khác cùng Apple ID, bấm Khôi phục.</p>' +
      '<div class="btns"><button class="btn gray" onclick="dongSheet()">Đóng</button></div>');
    var $m = document.getElementById('bqMsg');
    if (!da) layGia().then(function (g) { var e = document.getElementById('bqGia'); if (e && g) e.textContent = '· ' + g; });
    var bMua = document.getElementById('bqMua');
    if (bMua) bMua.onclick = function () {
      if (!NATIVE || !NP()) return;
      var b = this; b.disabled = true; $m.textContent = 'Đang kết nối App Store…';
      NP().purchaseProduct({ productIdentifier: SP, productType: 'inapp', quantity: 1 }).then(function (t) {
        moKhoa(); dongSheet(); toast('✓ Cảm ơn anh! Đã mở khoá bản đầy đủ'); location.hash = ''; ve();
      }, function (e) {
        b.disabled = false; var t = String(e && (e.message || e));
        $m.innerHTML = /cancel/i.test(t) ? 'Đã huỷ mua.' : '<span class="red">Chưa mua được: ' + esc(t) + '</span>';
      });
    };
    document.getElementById('bqKP').onclick = function () {
      if (!NATIVE || !NP()) return;
      var b = this; b.disabled = true; $m.textContent = 'Đang khôi phục…';
      NP().restorePurchases().catch(function () {}).then(function () { return kiemTra(); }).then(function (ok) {
        b.disabled = false;
        if (ok) { dongSheet(); toast('✓ Đã khôi phục bản đầy đủ'); location.hash = ''; ve(); }
        else $m.textContent = 'Apple ID này chưa mua bản đầy đủ.';
      });
    };
  }
  function nhan() { return daMua() ? 'Bản đầy đủ' : hetHan() ? 'Hết hạn dùng thử' : 'Dùng thử còn ' + conNgay() + ' ngày'; }
  return { daMua: daMua, batDauThu: batDauThu, hetHan: hetHan, veHetHan: veHetHan, bang: bang, kiemTra: kiemTra, moMua: moMua, nhan: nhan };
})();

/* ======================= NHẮC CHẤM CÔNG HẰNG NGÀY ======================= */
/* Thông báo trên máy (không cần mạng, không cần máy chủ). Lập lịch 14 ngày tới,
   tự bỏ nhắc hôm nay nếu đã chấm xong; lập lại mỗi lần mở app hoặc chấm công. */
var NHAC = (function () {
  var K = 'cc_nhac', ID0 = 7000, SO_NGAY = 14, hen = null;
  function cfg() { var d = { bat: false, ql: '17:00', vao: '07:00', ra: '17:00', cn: false }; try { return Object.assign(d, JSON.parse(lsGet(K)) || {}); } catch (e) { return d; } }
  function ghiCfg(c) { lsSet(K, JSON.stringify(c)); }
  var LN = function () { return CP.LocalNotifications; };
  function luc(ngay, hhmm) { var a = hhmm.split(':'); var d = new Date(ngay); d.setHours(+a[0], +a[1], 0, 0); return d; }
  function qlConThieu() {
    var hn = homNay();
    return db.nv.filter(function (n) { return !n.xoa && !n.tamNgung && timNhom(n.nhomId); }).filter(function (n) { return !getCong(n.id, hn); }).length;
  }
  function dsThongBao() {
    var c = cfg(), vai = lsGet('cc_vai') || (NATIVE ? '' : 'ql'), ds = [], bayGio = Date.now();
    if (!c.bat || !vai) return ds;
    var dc = vai === 'nv' && NV.daCham ? NV.daCham() : null;
    if (vai === 'nv' && !dc) return ds;  // nhân viên chưa đăng nhập
    for (var i = 0; i < SO_NGAY; i++) {
      var ngay = new Date(); ngay.setDate(ngay.getDate() + i);
      if (!c.cn && ngay.getDay() === 0) continue;
      var homnay = i === 0;
      if (vai === 'ql') {
        var at = luc(ngay, c.ql);
        if (at <= bayGio) continue;
        if (homnay) { var thieu = qlConThieu(); if (!thieu) continue; }
        ds.push({ id: ID0 + i * 2, title: '⏰ Chấm công hôm nay', body: homnay ? 'Còn ' + thieu + ' người chưa chấm công hôm nay. Bấm để chấm.' : 'Đến giờ chấm công cho thợ. Bấm để mở app chấm.', schedule: { at: at, allowWhileIdle: true } });
      } else {
        var a1 = luc(ngay, c.vao), a2 = luc(ngay, c.ra);
        if (a1 > bayGio && !(homnay && dc.vao)) ds.push({ id: ID0 + i * 2, title: '👷 Nhớ VÀO CA', body: 'Tới công trình thì mở app bấm VÀO CA nhé.', schedule: { at: a1, allowWhileIdle: true } });
        if (a2 > bayGio && !(homnay && dc.ra)) ds.push({ id: ID0 + i * 2 + 1, title: '🏠 Nhớ RA CA', body: 'Trước khi về nhớ bấm RA CA để tính đủ công.', schedule: { at: a2, allowWhileIdle: true } });
      }
    }
    return ds;
  }
  function huyHet() {
    var ids = []; for (var i = 0; i < SO_NGAY * 2; i++) ids.push({ id: ID0 + i });
    return LN().cancel({ notifications: ids }).catch(function () {});
  }
  function lap() {
    if (!NATIVE || !LN()) return Promise.resolve();
    return huyHet().then(function () {
      var ds = dsThongBao(); if (!ds.length) return;
      return LN().schedule({ notifications: ds });
    }).catch(function () {});
  }
  function henLap() { if (!NATIVE) return; clearTimeout(hen); hen = setTimeout(lap, 1500); }
  function xinQuyen() {
    if (!NATIVE || !LN()) return Promise.resolve(false);
    return LN().requestPermissions().then(function (r) { return r && r.display === 'granted'; }, function () { return false; });
  }
  function moCaiDat() {
    var c = cfg(), nv = lsGet('cc_vai') === 'nv';
    var o = function (id, nhan, v) { return '<label>' + nhan + '</label><input id="' + id + '" type="time" value="' + v + '">'; };
    sheet('<h2>🔔 Nhắc chấm công hằng ngày</h2>' +
      (NATIVE ? '' : '<p class="red" style="font-size:14px">Nhắc bằng thông báo chỉ có trên app tải từ App Store / Google Play. Bản mở bằng trình duyệt không gửi được thông báo khi đang đóng.</p>') +
      '<p class="muted" style="margin-top:-4px;font-size:14px">' + (nv ? 'Điện thoại sẽ nhắc anh/chị bấm VÀO CA và RA CA. Ngày đã chấm thì không nhắc nữa.' : 'Điện thoại nhắc anh chấm công cho thợ. Hôm nào đã chấm đủ mọi người thì không nhắc.') + '</p>' +
      '<label style="display:flex;align-items:center;gap:10px;font-size:17px;color:inherit"><input id="nhBat" type="checkbox" style="width:24px;height:24px"' + (c.bat ? ' checked' : '') + '> Bật nhắc</label>' +
      (nv ? '<div class="row"><div style="flex:1">' + o('nhVao', 'Giờ nhắc vào ca', c.vao) + '</div><div style="flex:1">' + o('nhRa', 'Giờ nhắc ra ca', c.ra) + '</div></div>' : o('nhQl', 'Giờ nhắc', c.ql)) +
      '<label style="display:flex;align-items:center;gap:10px;color:inherit"><input id="nhCn" type="checkbox" style="width:22px;height:22px"' + (c.cn ? ' checked' : '') + '> Nhắc cả Chủ nhật</label>' +
      '<p id="nhMsg" class="muted" style="font-size:14px"></p>' +
      '<div class="btns"><button class="btn gray" onclick="dongSheet()">Đóng</button><button class="btn p" id="nhLuu">Lưu</button></div>');
    document.getElementById('nhLuu').onclick = function () {
      var g = function (id) { var e = document.getElementById(id); return e && e.value; };
      c.bat = document.getElementById('nhBat').checked; c.cn = document.getElementById('nhCn').checked;
      if (nv) { c.vao = g('nhVao') || c.vao; c.ra = g('nhRa') || c.ra; } else c.ql = g('nhQl') || c.ql;
      ghiCfg(c);
      if (!c.bat) { lap(); dongSheet(); return toast('Đã tắt nhắc'); }
      if (!NATIVE) { dongSheet(); return toast('Đã lưu (chỉ nhắc trên app App Store)'); }
      xinQuyen().then(function (ok) {
        if (!ok) { document.getElementById('nhMsg').innerHTML = '<span class="red">Máy chưa cho phép thông báo. Vào Cài đặt › Thông báo › Chấm Công › bật Cho phép thông báo, rồi bấm Lưu lại.</span>'; return; }
        lap().then(function () { dongSheet(); toast('✓ Sẽ nhắc ' + (nv ? 'lúc ' + c.vao + ' và ' + c.ra : 'lúc ' + c.ql) + ' mỗi ngày'); ve2(); });
      });
    };
  }
  function ve2() { if (lsGet('cc_vai') === 'nv') { if (NV.lamMoi) NV.lamMoi(); } else if (typeof ve === 'function') ve(); }
  function nhan() { var c = cfg(); return c.bat ? (lsGet('cc_vai') === 'nv' ? c.vao + ' · ' + c.ra : c.ql) : 'đang tắt'; }
  return { lap: lap, henLap: henLap, moCaiDat: moCaiDat, nhan: nhan };
})();

/* Màn hình chọn vai trò khi mở app App Store lần đầu */
function chonVaiTro() {
  document.getElementById('app').innerHTML = '<div class="hdr"><h1>Chấm Công Tính Lương</h1></div>' +
    '<div class="card pad" style="text-align:center"><p style="font-size:17px;margin-top:4px">Anh/chị dùng app với vai trò nào?</p>' +
    '<button class="btn p" style="width:100%;padding:18px 0;font-size:19px" onclick="datVaiTro(\'ql\')">👔 Chủ / quản lý<br><small style="font-weight:400">Chấm công, tính lương, thu chi công trình</small></button>' +
    '<button class="btn g" style="width:100%;padding:18px 0;font-size:19px;margin-top:12px" onclick="datVaiTro(\'nv\')">👷 Nhân viên<br><small style="font-weight:400">Tự chấm vào ca / ra ca tại công trình</small></button>' +
    '<p class="muted" style="font-size:13px;margin-bottom:0">Dữ liệu lưu trong máy, dùng được khi không có mạng.</p></div>';
}
function datVaiTro(v) { lsSet('cc_vai', v); location.reload(); }
function doiVaiTro() { try { localStorage.removeItem('cc_vai'); } catch (e) {} location.reload(); }

/* ======================= KHỞI ĐỘNG ======================= */
var Q = new URLSearchParams(location.search);
if (Q.get('nv')) { lsSet('cc_vai', 'nv'); if (Q.get('may')) lsSet('cc_nv_may', Q.get('may')); if (Q.get('ma')) lsSet('cc_nv_ma_goiy', Q.get('ma')); }
var VAI = lsGet('cc_vai') || (NATIVE ? '' : 'ql');
var ngayDangXem = homNay();
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (homNay() !== ngayDangXem) { ngayDangXem = homNay(); S.th = thangNay(); }
  if (!VAI) return;
  NHAC.henLap();
  if (VAI === 'nv') return NV.lamMoi();
  if (db.cfg.mayChu) dongBo(true);
  if (!document.querySelector('.ov') && !document.getElementById('manKhoa')) ve();
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
if (VAI) NHAC.henLap();
if (NATIVE && !lsGet('cc_vai')) chonVaiTro();
else if (VAI === 'nv') NV.batDau();
else {
  BQ.batDauThu();
  if (KHOA.coKhoa()) KHOA.khoa(function () { ve(); }); else ve();
  if (NATIVE && !BQ.daMua()) BQ.kiemTra();
  if (db.cfg.mayChu) dongBo(true);
  // Máy quản lý: 1 phút lấy chấm công mới của nhân viên 1 lần
  setInterval(function () { if (db.cfg.mayChu && document.visibilityState === 'visible' && navigator.onLine !== false) dongBo(true); }, 60000);
}
</script>
