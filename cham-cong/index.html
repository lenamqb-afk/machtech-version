<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Chấm công</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chấm công">
<meta name="theme-color" content="#eef3f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#eef3f7;--card:#fff;--fg:#1f2340;--muted:#8a8fa3;--line:#e3e6ee;
  --blue:#2563eb;--purple:#6d4aff;--orange:#ff9800;--green:#8bc34a;--green2:#4caf50;
  --red:#e53935;--half:#2ea8ff;--np:#b98580;--nk:#c98d8d;--nl:#555a74;--none:#d5cfcf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hdr{display:flex;align-items:center;gap:8px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.hdr h1{flex:1;font-size:22px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;font-size:20px;color:var(--fg);box-shadow:0 1px 3px #0001}
.back{background:none;box-shadow:none;font-size:28px;width:32px}
.card{background:var(--card);border-radius:18px;margin:10px 0;overflow:hidden;box-shadow:0 1px 2px #0000000d}
.pad{padding:14px 18px}
.dash{border-top:1.5px dashed var(--line)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:17px}
.kv b{font-weight:600}
.muted{color:var(--muted)}
.blue{color:var(--blue)}.red{color:var(--red)}.green{color:var(--green2)}
.money-hide{letter-spacing:1px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 8px}
.act{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:var(--fg);padding:4px 0}
.act i{width:54px;height:54px;border-radius:14px;background:#fff;box-shadow:0 2px 6px #0000001a;display:grid;place-items:center;font-style:normal;font-size:24px}
.pill{display:block;margin:4px auto 14px;border:0;background:#e9ecf1;border-radius:99px;padding:8px 18px;font-size:16px;color:var(--fg)}
.seg{display:flex;background:#e3e7ec;border-radius:99px;padding:4px;margin:14px auto;max-width:420px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:10px;font-size:16px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--fg);font-weight:500;box-shadow:0 1px 3px #0002}
.sec{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.sec h3{flex:1;margin:0;font-size:17px;font-weight:600}
.search{border:0;background:#fff;border-radius:99px;padding:8px 14px;font-size:15px;width:140px}
.emp .top{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}
.av{width:44px;height:44px;border-radius:50%;background:#8e8fa8;color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.emp .nm{flex:1}.emp .nm b{display:block;font-size:17px;font-weight:500}.emp .nm span{font-size:14px;color:var(--muted)}
.emp .row2{display:flex;justify-content:space-between;padding:4px 18px;font-size:16px}
.emp .btns{display:flex;gap:10px;padding:10px 18px 16px}
.btn{border:0;border-radius:14px;padding:13px 10px;font-size:17px;color:#fff;flex:1;font-weight:500}
.btn.o{background:var(--orange)}.btn.b{background:var(--blue)}.btn.p{background:var(--purple)}.btn.g{background:var(--green2)}
.btn.done{background:#e8f5e9;color:var(--green2);border:1.5px solid var(--green2)}
.btn.gray{background:#e9ecf1;color:var(--fg)}
.btn.red{background:#fdecea;color:var(--red)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:#fff3e0;color:#e65100;margin-left:6px;vertical-align:middle}
.cal-h{display:flex;align-items:center;gap:12px;margin:18px 0 8px}
.cal-h h3{flex:1;margin:0;font-size:22px;font-weight:600}
.cal-h button{border:1.5px solid var(--fg);background:none;border-radius:8px;width:34px;height:34px;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;color:var(--fg);font-size:15px;padding:6px 0}
.day{aspect-ratio:1/1;border-radius:9px;position:relative;border:0;background:none;padding:0;color:var(--fg)}
.day .s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;padding-bottom:6px}
.day .l{position:absolute;left:5px;bottom:3px;font-size:11px}
.day .mk{position:absolute;right:4px;top:3px;font-size:10px}
.day.c1{background:var(--green);color:#fff}.day.c05{background:var(--half);color:#fff}
.day.cP{background:var(--np);color:#fff}.day.cK{background:var(--nk);color:#fff}.day.cL{background:var(--nl);color:#fff}
.day.cN{background:var(--none);color:#fff}
.day.today{outline:2.5px solid var(--purple);outline-offset:1px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:16px 0;font-size:16px}
.legend div{display:flex;align-items:center;gap:8px}
.sw{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;font-size:12px;flex:none}
.toggle{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:16px;margin:6px 0 14px}
.sw-t{width:58px;height:32px;border-radius:99px;background:#c9ced8;position:relative;border:0}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw-t.on{background:var(--blue)}.sw-t.on::after{left:29px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:9}
.bottom .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bottom .in span{flex:1;font-size:17px}
.bottom .btn{flex:none;padding:14px 22px;font-size:18px}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--orange);color:#fff;border:0;font-size:30px;box-shadow:0 4px 12px #ff980066;z-index:9}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .t{flex:1}.list .it .t small{display:block;color:var(--muted);font-size:13px}
.grp{display:flex;align-items:center;gap:12px;padding:16px 18px;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit}
.grp .t{flex:1}.grp .t b{font-size:18px;font-weight:600;display:block}.grp .t small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
/* sheet */
.ov{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#d6d9e0;margin:4px auto 10px}
.sheet h2{font-size:20px;margin:4px 0 12px}
.sheet label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#f7f8fb;color:var(--fg)}
.sheet .row{display:flex;gap:10px}.sheet .row>*{flex:1}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid transparent;border-radius:12px;padding:12px 8px;font-size:16px;display:flex;align-items:center;gap:8px;background:#f3f5f9;color:var(--fg)}
.opt.on{border-color:var(--purple);background:#f0ecff}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#1f2340;color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;z-index:40;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="bottom"></div>
<div id="sheetHost"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
'use strict';
/* ======================= ÂM LỊCH (thuật toán Hồ Ngọc Đức, múi giờ +7) ======================= */
var AL = (function () {
  var INT = Math.floor, PI = Math.PI;
  function jd(dd, mm, yy) { var a = INT((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3; var j = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045; if (j < 2299161) j = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083; return j; }
  function newMoon(k, tz) {
    var T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = PI / 180;
    var Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3 + 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    var M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    var Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
    var F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
    var C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M) - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr) - 0.0004 * Math.sin(dr * 3 * Mpr)
      + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr)) - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M))
      - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr)) + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
    var dt = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3 : -0.000278 + 0.000265 * T + 0.000262 * T2;
    return INT(Jd1 + C1 - dt + 0.5 + tz / 24);
  }
  function sunLong(jdn, tz) {
    var T = (jdn - 2451545.5 - tz / 24) / 36525, T2 = T * T, dr = PI / 180;
    var M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2, L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
    var DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M) + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
    var L = (L0 + DL) * dr; L = L - PI * 2 * INT(L / (PI * 2)); return INT(L / PI * 6);
  }
  function m11(yy, tz) { var k = INT((jd(31, 12, yy) - 2415021) / 29.530588853), nm = newMoon(k, tz); if (sunLong(nm, tz) >= 9) nm = newMoon(k - 1, tz); return nm; }
  function leapOff(a11, tz) { var k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5), last, i = 1, arc = sunLong(newMoon(k + i, tz), tz); do { last = arc; i++; arc = sunLong(newMoon(k + i, tz), tz); } while (arc != last && i < 14); return i - 1; }
  return function (dd, mm, yy) {
    var tz = 7, dn = jd(dd, mm, yy), k = INT((dn - 2415021.076998695) / 29.530588853), ms = newMoon(k + 1, tz);
    if (ms > dn) ms = newMoon(k, tz);
    var a11 = m11(yy, tz), b11 = a11;
    if (a11 >= ms) a11 = m11(yy - 1, tz); else b11 = m11(yy + 1, tz);
    var day = dn - ms + 1, diff = INT((ms - a11) / 29), month = diff + 11;
    if (b11 - a11 > 365) { var lo = leapOff(a11, tz); if (diff >= lo) month = diff + 10; }
    if (month > 12) month -= 12;
    return { d: day, m: month };
  };
})();

/* ======================= DỮ LIỆU ======================= */
var KEY = 'chamcong_v1';
function now() { return Date.now(); }
function uid() { return now().toString(36) + Math.random().toString(36).slice(2, 7); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function moi() { return { v: 1, nhom: [], nv: [], cong: {}, gd: [], cc: [], cfg: { an: true, amLich: true, mayChu: '', khoa: '', dongBoLuc: 0 } }; }
var db = (function () { try { var d = JSON.parse(lsGet(KEY)); if (d && d.v) return Object.assign(moi(), d, { cfg: Object.assign(moi().cfg, d.cfg) }); } catch (e) {} return moi(); })();
var hen = null;
function luu() {
  ccMap = null;
  if (!lsSet(KEY, JSON.stringify(db))) toast('Không lưu được dữ liệu trên máy!');
  if (db.cfg.mayChu) { clearTimeout(hen); hen = setTimeout(function () { dongBo(true); }, 2500); }
}
var nhomDS = function () { return db.nhom.filter(function (x) { return !x.xoa; }); };
var nvCua = function (nhomId, caTamNgung) { return db.nv.filter(function (x) { return !x.xoa && x.nhomId === nhomId && (caTamNgung || !x.tamNgung); }); };
var timNV = function (id) { return db.nv.find(function (x) { return x.id === id; }); };
var timNhom = function (id) { return db.nhom.find(function (x) { return x.id === id; }); };

/* ======================= TIỆN ÍCH ======================= */
var LOAI_CONG = {
  '1': { ten: 'Đi làm', c: 'c1', he: 1, mau: 'var(--green)' },
  '0.5': { ten: '1/2 ngày', c: 'c05', he: 0.5, mau: 'var(--half)' },
  'P': { ten: 'Nghỉ có lý do', c: 'cP', he: 0, mau: 'var(--np)', k: '–' },
  'K': { ten: 'Nghỉ không lý do', c: 'cK', he: 0, mau: 'var(--nk)', k: '?' },
  'L': { ten: 'Nghỉ có lương', c: 'cL', he: 1, mau: 'var(--nl)', k: '–' }
};
var LOAI_GD = {
  ung: { ten: 'Ứng lương', ic: '💵', dau: -1 },
  tangca: { ten: 'Tăng ca', ic: '⏱️', dau: 1 },
  phucap: { ten: 'Phụ cấp', ic: '🎁', dau: 1 },
  tru: { ten: 'Trừ tiền', ic: '➖', dau: -1 },
  thanhtoan: { ten: 'Thanh toán', ic: '✅', dau: -1 }
};
function p2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function homNay() { return ymd(new Date()); }
function thangNay() { return homNay().slice(0, 7); }
function soNgay(th) { return new Date(+th.slice(0, 4), +th.slice(5, 7), 0).getDate(); }
function themThang(th, n) { var d = new Date(+th.slice(0, 4), +th.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); }
function tien(n) { return Math.round(n || 0).toLocaleString('en-US') + ' đ'; }
function tienAn(n) { return db.cfg.an ? '<span class="money-hide">*,***,***</span> đ' : tien(n); }
function soCong(n) { return (Math.round(n * 10) / 10).toFixed(1).replace('.', ','); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function soTien(s) { return Number(String(s || '').replace(/[^\d-]/g, '')) || 0; }
function dmy(s) { var a = s.split('-'); return a[2] + '/' + a[1] + '/' + a[0]; }
function toast(t) { var e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2200); }
/* Chấm công của nhân viên tự chấm bằng điện thoại (db.cc) */
var ccMap = null;
function ccIndex() {
  if (ccMap) return ccMap; ccMap = {};
  (db.cc || []).forEach(function (x) { if (x.xoa) return; var k = x.nvId + '|' + x.ngay; (ccMap[k] = ccMap[k] || []).push(x); });
  return ccMap;
}
function ccCua(nvId, ngay) { return (ccIndex()[nvId + '|' + ngay] || []).slice().sort(function (a, b) { return a.tg < b.tg ? -1 : 1; }); }
/* Từ các lần chấm trong ngày -> công: có VÀO là đi làm; có RA mà làm ít hơn gioNua giờ thì 1/2 công */
function congTuCham(recs, gioNua) {
  var vao = null, ra = null;
  recs.filter(function (x) { return x.ok !== false; }).sort(function (a, b) { return a.tg < b.tg ? -1 : 1; }).forEach(function (x) {
    if (x.loai === 'VAO' && !vao) vao = x;
    if (x.loai === 'RA' && vao && x.tg > vao.tg) ra = x;
  });
  if (!vao) return null;
  var gio = ra ? (new Date(ra.tg.replace(' ', 'T')) - new Date(vao.tg.replace(' ', 'T'))) / 3600000 : 0;
  return { tt: ra && gio < (+gioNua || 5) ? '0.5' : '1', tu: 'nv', vao: vao.tg.slice(11, 16), ra: ra ? ra.tg.slice(11, 16) : '', gio: gio, gc: '' };
}
function getCongTay(nvId, ngay) { var c = db.cong[nvId + '|' + ngay]; return c && c.tt ? c : null; }
function getCong(nvId, ngay) {
  var c = getCongTay(nvId, ngay); if (c) return c;
  var r = ccCua(nvId, ngay); if (!r.length) return null;
  var nv = timNV(nvId), g = nv && timNhom(nv.nhomId);
  return congTuCham(r, g && g.gioNua);
}
function dongCham(nvId, ngay) {
  var r = ccCua(nvId, ngay); if (!r.length) return '';
  return '<div class="row2" style="font-size:14px;color:var(--muted)">📍 ' + r.map(function (x) { return (x.loai === 'VAO' ? 'Vào ' : 'Ra ') + x.tg.slice(11, 16) + (x.ok === false ? ' <span class="red">✗ ngoài vùng</span>' : ''); }).join(' · ') + '</div>';
}
function goiMay(url, body, ms) {
  var ctl = window.AbortController ? new AbortController() : null, t = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 15000);
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { clearTimeout(t); return r.json(); }, function (e) { clearTimeout(t); throw e; });
}
function kcach(a, b, c, d) { var R = 6371000, r = Math.PI / 180, x = Math.sin((c - a) * r / 2), y = Math.sin((d - b) * r / 2); var h = x * x + Math.cos(a * r) * Math.cos(c * r) * y * y; return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h)); }
function coToaDo(g) { return g && g.viDo !== undefined && g.viDo !== '' && g.viDo !== null && !isNaN(+g.viDo); }
function setCong(nvId, ngay, tt, gc) {
  var k = nvId + '|' + ngay, c = db.cong[k] || {};
  db.cong[k] = { tt: tt || '', gc: gc !== undefined ? gc : (c.gc || ''), upd: now() };
  luu();
}

/* Tính tiền công của 1 nhân viên trong 1 tháng (th = 'yyyy-mm') hoặc tất cả (th = null) */
function tinh(nv, th) {
  var r = { cong: 0, nLam: 0, nNua: 0, nP: 0, nK: 0, nL: 0, nChua: 0, luong: 0, tangca: 0, phucap: 0, ung: 0, tru: 0, thanhtoan: 0, ngayTC: {} };
  var tien1 = +nv.luongNgay || 0;
  var ngays = {};
  Object.keys(db.cong).forEach(function (k) { var i = k.indexOf('|'); if (k.slice(0, i) === nv.id) ngays[k.slice(i + 1)] = 1; });
  (db.cc || []).forEach(function (x) { if (!x.xoa && x.nvId === nv.id) ngays[x.ngay] = 1; });
  Object.keys(ngays).forEach(function (ngay) {
    if (th && ngay.slice(0, 7) !== th) return;
    var c = getCong(nv.id, ngay); if (!c) return;
    var L = LOAI_CONG[c.tt]; if (!L) return;
    r.cong += L.he;
    if (c.tt === '1') r.nLam++; else if (c.tt === '0.5') r.nNua++; else r['n' + c.tt]++;
  });
  r.luong = r.cong * tien1;
  db.gd.forEach(function (g) {

    cho().forEach(function (x) { var t = new Date(x.tgMay); if (ymd(t) === hn) d.push({ id: x.id, loai: x.loai, tg: hn + ' ' + t.toTimeString().slice(0, 8), ngay: hn, ok: true, cho: true, kc: x.kc }); });
    return d.sort(function (a, b) { return a.tg < b.tg ? -1 : 1; });
  }

  function veChinh() {
    var nv = phien.nv, hn = homNay(), cc = homNayCC(), cuoi = cc.filter(function (x) { return x.ok !== false; }).pop();
    var loai = cuoi && cuoi.loai === 'VAO' ? 'RA' : 'VAO', tu = congTuCham(cc, nv.gioNua);
    var a = hn.split('-'), al = AL(+a[2], +a[1], +a[0]), soCho = cho().length;

      var lc = AL(d, m, y);
      cal += '<div class="day ' + (c ? LOAI_CONG[c.tt].c : (ngay <= hn ? 'cN' : '')) + (ngay === hn ? ' today' : '') + '"><span class="s">' + d + '</span><span class="l">' + (lc.d === 1 ? '1/' + lc.m : lc.d) + '</span></div>';
    }
    $app('<div class="hdr"><div style="flex:1;min-width:0"><h1>' + esc(nv.ten) + '</h1><div class="muted" style="font-size:14px">' + esc(nv.ma) + (nv.nhom ? ' · ' + esc(nv.nhom) : '') + '</div></div><button class="ic" onclick="NV.menu()">⋯</button></div>' +
      '<div class="card pad" style="text-align:center"><div id="nvGio" style="font-size:52px;font-weight:700;font-variant-numeric:tabular-nums">' + new Date().toTimeString().slice(0, 8) + '</div>' +
      '<div class="muted">' + ngayThu(hn).replace('CN', 'Chủ nhật').replace(/^T(\d)/, 'Thứ $1') + '/' + a[0] + ' · âm ' + al.d + '/' + al.m + '</div>' +
      '<div style="display:flex;gap:8px;margin:14px 0">' + [['Giờ vào', tu ? tu.vao : '--:--'], ['Giờ ra', tu && tu.ra ? tu.ra : '--:--'], ['Công hôm nay', tu ? (tu.tt === '1' ? '1' : '1/2') : '0']].map(function (x) { return '<div style="flex:1;background:#f3f5f9;border-radius:12px;padding:8px"><b style="font-size:20px">' + x[1] + '</b><div class="muted" style="font-size:13px">' + x[0] + '</div></div>'; }).join('') + '</div>' +
      '<button id="nvCham" class="btn ' + (loai === 'VAO' ? 'g' : 'o') + '" style="width:100%;padding:26px 0;font-size:26px;font-weight:700;border-radius:20px" onclick="NV.cham(\'' + loai + '\')">' + (loai === 'VAO' ? 'VÀO CA' : 'RA CA') + '</button>' +
      '<div id="nvGps" class="muted" style="font-size:14px;margin-top:10px">' + chuGPS() + '</div>' +
      (msg ? '<div style="margin-top:10px;padding:10px;border-radius:12px;font-weight:600;background:' + (msg[0] ? '#e8f5e9;color:#2e7d32' : '#fdecea;color:#c62828') + '">' + esc(msg[1]) + '</div>' : '') +
      (soCho ? '<div style="margin-top:10px;font-size:14px;color:#e65100">⏳ ' + soCho + ' lần chấm đang chờ gửi (sẽ tự gửi khi có mạng)</div>' : '') + '</div>' +
      (cc.length ? '<div class="card list">' + cc.map(function (x) { return '<div class="it"><span>' + (x.loai === 'VAO' ? '🟢' : '🟠') + '</span><div class="t">' + (x.loai === 'VAO' ? 'Vào ca ' : 'Ra ca ') + x.tg.slice(11, 16) + '<small>' + (x.cho ? 'chờ gửi' : x.ok === false ? 'ngoài công trình' : 'đã gửi quản lý ✓') + (x.kc != null ? ' · cách ' + x.kc + ' m' : '') + '</small></div></div>'; }).join('') + '</div>' : '') +
      '<div class="cal-h"><button onclick="NV.thang(-1)">‹‹</button><h3>Tháng ' + m + '/' + y + '</h3><button onclick="NV.thang(1)">››</button></div><div class="cal">' + cal + '</div>' +
      '<div class="legend"><div><span class="sw" style="background:var(--green)"></span>Đi làm: ' + demL + '</div><div><span class="sw" style="background:var(--half)"></span>1/2 ngày: ' + demN + '</div><div><b>Tổng công: ' + soCong(tong) + '</b></div></div>' +
      '<p class="muted" style="font-size:13px">Công trên lịch là công quản lý đã xác nhận (nếu có), còn lại tính từ giờ anh/chị tự chấm.</p>');
  }

  function chuGPS() {
    var nv = phien.nv;
    if (!vt) return gps === 'loi' ? '<span class="red">Chưa lấy được vị trí. Bật Dịch vụ định vị và cho phép app dùng vị trí.</span>' : 'Đang lấy vị trí…';
    var s = '📍 Sai số ±' + Math.round(vt.acc) + ' m';
    if (coToaDo(nv)) { var k = Math.round(kcach(vt.lat, vt.lng, +nv.viDo, +nv.kinhDo)), ok = k <= +nv.banKinh; s += ' · <span class="' + (ok ? 'green' : 'red') + '">cách công trình ' + k + ' m ' + (ok ? '✓' : '(cho phép ' + nv.banKinh + ' m)') + '</span>'; }
    return s;
  }
  function batGPS() {
    if (!navigator.geolocation || gps === 'xem') return;
    gps = 'xem';
    navigator.geolocation.watchPosition(function (p) { vt = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }; var e = document.getElementById('nvGps'); if (e) e.innerHTML = chuGPS(); },
      function () { vt = null; gps = 'loi'; var e = document.getElementById('nvGps'); if (e) e.innerHTML = chuGPS(); }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
  }
  function layViTri(cb) {
    if (vt && Date.now() - vt.t < 30000 && vt.acc < 100) return cb(vt);
    if (!navigator.geolocation) return cb(null);
    navigator.geolocation.getCurrentPosition(function (p) { vt = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }; cb(vt); },
      function () { cb(vt && Date.now() - vt.t < 120000 ? vt : null); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  function cham(loai) {
    var b = document.getElementById('nvCham'), nv = phien.nv;
    b.disabled = true; b.textContent = 'Đang lấy vị trí…';
    layViTri(function (v) {
      var bao = function (ok, t) { msg = [ok, t]; veChinh(); if (ok && navigator.vibrate) navigator.vibrate(80); };
      if (coToaDo(nv)) {
        if (!v) return bao(false, 'Không lấy được vị trí. Bật Dịch vụ định vị (Cài đặt › Quyền riêng tư › Dịch vụ định vị) rồi thử lại.');
        var k = Math.round(kcach(v.lat, v.lng, +nv.viDo, +nv.kinhDo));
        if (k > +nv.banKinh) return bao(false, 'Bạn đang cách công trình ' + k + ' m (cho phép ' + nv.banKinh + ' m). Hãy tới công trình rồi chấm lại.');
      }
      var rec = { id: uid(), loai: loai, lat: v ? v.lat : null, lng: v ? v.lng : null, acc: v ? v.acc : null, tgMay: Date.now(), kc: v && coToaDo(nv) ? Math.round(kcach(v.lat, v.lng, +nv.viDo, +nv.kinhDo)) : null };
      var luuCho = function () { var q = cho(); q.push(Object.assign({}, rec, { offline: true })); ghi(K_CHO, q); bao(true, '✓ Đã ghi ' + (loai === 'VAO' ? 'VÀO CA' : 'RA CA') + ' lúc ' + new Date(rec.tgMay).toTimeString().slice(0, 5) + '. Đang mất mạng, sẽ tự gửi khi có mạng.'); };
      if (navigator.onLine === false) return luuCho();
      b.textContent = 'Đang gửi…';
      goiMay(may(), { action: 'nvCham', ma: phien.ma, pin: phien.pin, ds: [rec] }, 20000).then(function (r) {
        if (!r.ok) { if (/PIN|tạm ngừng/.test(r.err)) return dangXuat(r.err); return bao(false, r.err); }
        var x = r.kq[0]; phien.nv = r.nv; ghi(K_PHIEN, phien);
        if (!x.ok) return bao(false, x.err);
        themLS({ id: x.id, nvId: r.nv.id, loai: loai, tg: x.tg, ngay: x.tg.slice(0, 10), kc: x.kc, ok: true, gc: x.gc });
        bao(true, '✓ Đã ' + (loai === 'VAO' ? 'VÀO CA' : 'RA CA') + ' lúc ' + x.tg.slice(11, 16) + (x.kc != null ? ' (cách công trình ' + x.kc + ' m)' : ''));
      }).catch(luuCho);
    });
  }
  function themLS(x) { var l = ls(), t = x.ngay.slice(0, 7); l[t] = l[t] || { cc: [], cong: {} }; if (!l[t].cc.some(function (c) { return c.id === x.id; })) l[t].cc.push(x); ghi(K_LS, l); }

  function guiCho(cb) {
    var q = cho(); if (!phien || !q.length || dangGui || navigator.onLine === false) { if (typeof cb === 'function') cb(); return; }
    dangGui = true;
    goiMay(may(), { action: 'nvCham', ma: phien.ma, pin: phien.pin, ds: q }, 30000).then(function (r) {
      dangGui = false; if (!r.ok) return;
      var xong = {}; r.kq.forEach(function (k) { xong[k.id] = 1; });
      ghi(K_CHO, cho().filter(function (x) { return !xong[x.id]; }));
      msg = [r.loi === 0, r.loi ? r.loi + ' lần chấm khi mất mạng bị ghi là ngoài công trình' : '✓ Đã gửi ' + r.kq.length + ' lần chấm lúc mất mạng'];
      taiLS(); if (typeof cb === 'function') cb();
    }).catch(function () { dangGui = false; if (typeof cb === 'function') cb(); });
  }
  function taiLS() {
    if (!phien || navigator.onLine === false) return veChinh();
    goiMay(may(), { action: 'nvLichSu', ma: phien.ma, pin: phien.pin, thang: th }, 30000).then(function (r) {
      if (!r.ok) { if (/PIN|tạm ngừng/.test(r.err)) dangXuat(r.err); return; }
      var l = ls(); l[th] = { cc: r.cc, cong: r.cong }; ghi(K_LS, l); phien.nv = r.nv; ghi(K_PHIEN, phien); veChinh();
    }).catch(function () { veChinh(); });
  }
  function lamMoi() { if (!phien) return; th = thangNay(); veChinh(); guiCho(taiLS); }
  function dangXuat(ly) { phien = null; lsSet(K_PHIEN, 'null'); veDN(ly); }
  function menu() {
    sheet('<h2>' + esc(phien.nv.ten) + '</h2><p class="muted">Mã ' + esc(phien.ma) + (phien.nv.nhom ? ' · ' + esc(phien.nv.nhom) : '') + (coToaDo(phien.nv) ? '<br>Bán kính chấm công: ' + phien.nv.banKinh + ' m' : '') + '</p>' +
      '<button class="btn gray" style="width:100%" onclick="dongSheet();NV.lamMoi()">🔄 Làm mới</button>' +
      '<button class="btn red" style="width:100%;margin-top:10px" id="dxOk">Đăng xuất</button>');
    document.getElementById('dxOk').onclick = function () {
      if (cho().length) { this.textContent = 'Còn ' + cho().length + ' lần chấm chưa gửi, hãy bật mạng trước'; return; }
      dongSheet(); dangXuat();
    };
  }
  return { batDau: batDau, cham: cham, lamMoi: lamMoi, menu: menu, thang: function (d) { th = themThang(th, d); msg = null; veChinh(); taiLS(); } };
})();

var Q = new URLSearchParams(location.search);
if (Q.get('nv')) { lsSet('cc_vai', 'nv'); if (Q.get('may')) lsSet('cc_nv_may', Q.get('may')); if (Q.get('ma')) lsSet('cc_nv_ma_goiy', Q.get('ma')); }
var VAI = lsGet('cc_vai') || 'ql';
var ngayDangXem = homNay();
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (homNay() !== ngayDangXem) { ngayDangXem = homNay(); S.th = thangNay(); }
  if (VAI === 'nv') return NV.lamMoi();
  if (db.cfg.mayChu) dongBo(true);
  if (!document.querySelector('.ov')) ve();
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
if (VAI === 'nv') NV.batDau();
else {
  ve();
  if (db.cfg.mayChu) dongBo(true);
  // Máy quản lý: 1 phút lấy chấm công mới của nhân viên 1 lần
  setInterval(function () { if (db.cfg.mayChu && document.visibilityState === 'visible' && navigator.onLine !== false) dongBo(true); }, 60000);
}
</script>
